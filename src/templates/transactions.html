<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transacciones | ASISTENTE FINANCIERO</title>
<script>
window.ALL_CATEGORIES = {{ cats_json | safe }};
/* Tema ANTES que cualquier CSS para evitar flash */
(function(){
    var t = localStorage.getItem('theme') || 'dark';
    document.documentElement.className = t;
})();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: { extend: { colors: { primary: '#0052FF' } } }
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0" rel="stylesheet">
<style>
:root {
    --bg-dark: #07090E;
    --bg-panel: rgba(13, 18, 30, 0.75);
    --glass-border: rgba(255, 255, 255, 0.08);
    --primary-color: #0052FF;
    --primary-purple: #5631E8;
    --btn-radius: 9999px;
    --card-radius: 24px;
}

body {
    font-family: 'Plus Jakarta Sans', 'Inter', sans-serif !important;
    -webkit-font-smoothing: antialiased;
    background-color: #07090E !important;
    background-image: 
        radial-gradient(at 10% 10%, rgba(0, 82, 255, 0.15) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(86, 49, 232, 0.15) 0px, transparent 50%) !important;
    background-attachment: fixed !important;
    color: #FFFFFF !important;
    min-height: 100vh;
}

.unified-nav {
    position: fixed; top: 0; left: 0; width: 100%; height: 68px;
    background: rgba(7, 9, 14, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    font-family: 'Plus Jakarta Sans', sans-serif;
}
.unified-nav .logo { color: white; font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 12px; letter-spacing: -0.5px; }
.unified-nav .links { display: flex; gap: 6px; background: rgba(255,255,255,0.03); padding: 4px; border-radius: 9999px; border: 1px solid rgba(255, 255, 255, 0.08); }
.unified-nav a { color: #94A3B8; text-decoration: none; font-size: 13px; font-weight: 700; padding: 8px 18px; border-radius: 9999px; transition: all 0.2s ease; }
.unified-nav a:hover { color: white; background: rgba(255,255,255,0.06); }
.unified-nav a.active { color: white; background: #0052FF; box-shadow: 0 4px 12px rgba(0, 82, 255, 0.3); }

/* ── Glass card ── */
.glass-card {
    background: rgba(13, 18, 30, 0.75) !important;
    backdrop-filter: blur(20px) saturate(180%) brightness(1.05) !important;
    -webkit-backdrop-filter: blur(20px) saturate(180%) brightness(1.05) !important;
    border: 1px solid rgba(255, 255, 255, 0.08) !important;
    border-radius: 24px !important;
    box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 82, 255, 0.08) !important;
    position: relative;
    z-index: 10;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}
.glass-card:hover {
    border-color: rgba(0, 82, 255, 0.4) !important;
    box-shadow: 0 25px 50px -12px rgba(0, 82, 255, 0.2) !important;
}

/* ── Material icons ── */
.material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
}

/* ── Form inputs ── */
.form-input {
    width: 100%;
    background: rgba(15, 23, 42, 0.8) !important;
    border: 1px solid rgba(255,255,255,0.12) !important;
    border-radius: 9999px !important;
    padding: 0.5rem 1rem;
    color: #FFFFFF !important;
    transition: all 0.2s;
    outline: none;
}
.form-input:focus { border-color: #0052FF !important; box-shadow: 0 0 0 2px rgba(0, 82, 255, 0.3) !important; }

/* ── Toast ── */
.toast {
    position: fixed; bottom: 24px; right: 24px;
    transform: translateY(100px);
    transition: all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
    z-index: 2000; opacity: 0; pointer-events: none;
}
.toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }

/* ── Date wrapper ── */
.date-wrapper {
    display: inline-flex; align-items: center; gap: 0.4rem;
    cursor: pointer; background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 9999px;
    padding: 0.4rem 0.85rem; transition: all 0.2s; white-space: nowrap;
}
.date-wrapper:hover { border-color: #0052FF; }
.date-label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.03em; color: #FFFFFF; }
.date-icon { font-size: 14px !important; color: #94a3b8; }
.date-hidden { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }

/* ── Table rows ── */
.tx-row { transition: background 0.15s; color: #FFFFFF !important; }
table thead tr { color: #94a3b8 !important; }

.text-primary { color: #0052FF !important; }

/* ── Year separator ── */
.year-separator td {
    background: rgba(0, 82, 255, 0.1) !important;
    border-bottom: 2px solid rgba(0, 82, 255, 0.3) !important;
}

@media (max-width: 768px) {
    table thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tr {
        margin-bottom: 1.25rem; border-radius: 1.5rem; padding: 1.25rem;
        border: 1px solid rgba(255,255,255,0.1) !important;
        background: rgba(15,23,42,0.8) !important;
        backdrop-filter: blur(10px);
    }
    td { padding: 0 !important; border: none !important; }
}
</style>
</head>
<body class="min-h-screen text-white">

<!-- Header Unified Nav GBM Style -->
<nav class="unified-nav">
    <div class="logo">
        <div style="width: 36px; height: 36px; background: linear-gradient(135deg, #0052FF, #5631E8); border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0,82,255,0.4);">
            <span class="material-symbols-outlined" style="font-size: 20px; color: white;">receipt_long</span>
        </div>
        <span>ASISTENTE FINANCIERO</span>
        <span style="font-size: 11px; background: rgba(0,82,255,0.18); color: #60A5FA; padding: 3px 10px; border-radius: 9999px; font-weight: 800; border: 1px solid rgba(0,82,255,0.3);">TRANSACCIONES</span>
    </div>
    <div class="links">
        <a href="/dashboard">Dashboard</a>
        <a href="/transactions" class="active">Transacciones</a>
        <a href="/details">Analíticos</a>
        <a href="/bolsa">⚡ Inversiones IA</a>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
        <button id="theme-btn" onclick="toggleTheme()" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: white; width: 38px; height: 38px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
            <span class="material-symbols-outlined" style="font-size: 18px;">light_mode</span>
        </button>
        <span style="font-size: 11px; font-weight: 800; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); padding: 6px 14px; border-radius: 9999px; color: #94A3B8;">
            ● <span id="visible-count">0</span> REGISTROS
        </span>
    </div>
</nav>

<main class="pt-24 px-4 md:px-8 max-w-[1400px] mx-auto w-full pb-10">

    <!-- Filtros -->
    <div class="glass-card rounded-[2rem] p-6 mb-6">
        <!-- Year tabs -->
        <div class="flex flex-wrap gap-2 mb-4 pb-4 border-b border-slate-200 dark:border-slate-700/50">
            {{ years_html | safe }}
        </div>
        <div class="grid grid-cols-1 md:grid-cols-6 gap-3">
            <div class="md:col-span-2">
                <input type="text" id="filter-search" oninput="applyFilters()" class="form-input" placeholder="&#128269; Buscar...">
            </div>
            <div><input type="date" id="filter-date-from" onchange="applyFilters()" class="form-input"></div>
            <div><input type="date" id="filter-date-to" onchange="applyFilters()" class="form-input"></div>
            <div><select id="filter-category" onchange="applyFilters()" class="form-input">{{ cat_opts | safe }}</select></div>
            <div>
                <select id="filter-type" onchange="applyFilters()" class="form-input">
                    <option value="">Todos los tipos</option>
                    <option value="Normal">Normal</option>
                    <option value="Deuda">Deuda</option>
                    <option value="Prestamo">Préstamo</option>
                </select>
            </div>
        </div>
        <div class="mt-4 flex items-center justify-between">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Total filtrado</span>
            <span class="text-2xl font-black text-primary" id="filtered-total">$0.00</span>
        </div>
    </div>

    <!-- Tabla -->
    <div class="glass-card rounded-[2rem] overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full border-collapse" id="main-table">
                <thead>
                    <tr class="bg-slate-50/50 dark:bg-slate-900/50 text-left text-[10px] font-bold uppercase tracking-widest text-slate-400 border-b border-slate-200 dark:border-slate-700/50">
                        <th class="p-4">ID</th>
                        <th class="p-4">Fecha</th>
                        <th class="p-4">Comercio</th>
                        <th class="p-4">Categoría</th>
                        <th class="p-4">Tipo</th>
                        <th class="p-4">Detalles</th>
                        <th class="p-4">Monto</th>
                        <th class="p-4 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="transactions-list">{{ rows_html | safe }}</tbody>
            </table>
        </div>
    </div>
</main>

<div id="toast" class="toast bg-emerald-500 text-white px-6 py-3 rounded-2xl shadow-lg font-bold">
    <span>&#10003; Guardado</span>
</div>

<script>
/* ── Tema ── */
function toggleTheme() {
    var next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
    document.documentElement.className = next;
    localStorage.setItem('theme', next);
    updateThemeIcon(next);
}
function updateThemeIcon(theme) {
    var btn = document.getElementById('theme-btn');
    if (btn) btn.innerHTML = '<span class="material-symbols-outlined">' + (theme === 'dark' ? 'light_mode' : 'dark_mode') + '</span>';
}
/* Aplicar icono según tema actual */
updateThemeIcon(document.documentElement.className || 'light');

/* ── Formato ── */
function formatCurrency(val) {
    var n = parseFloat(String(val).replace(/,/g, '')) || 0;
    return '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function updateDateDisplay(inp) {
    var wrapper = inp.closest('.date-wrapper');
    var lbl = wrapper ? wrapper.querySelector('.date-label') : null;
    if (lbl && inp.value) {
        try {
            var d = new Date(inp.value + 'T00:00:00');
            var ms = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
            lbl.textContent = String(d.getDate()).padStart(2,'0') + ' ' + ms[d.getMonth()] + ' ' + d.getFullYear();
        } catch(e) {}
    }
}

/* ── Carga Diferida de Categorías (Lazy Load Select) ── */
function ensureCatOptions(sel) {
    if (sel.dataset.loaded === 'true') return;
    var currentVal = sel.dataset.val || '';
    var cats = window.ALL_CATEGORIES || [];
    
    var html = '<option value="">(Sin categoría)</option>';
    var found = false;
    
    cats.forEach(function(c) {
        var isSel = (c === currentVal);
        if (isSel) found = true;
        var title = c.charAt(0) + c.slice(1).toLowerCase();
        html += '<option value="' + c + '"' + (isSel ? ' selected' : '') + '>' + title + '</option>';
    });
    
    if (currentVal && !found) {
        var title = currentVal.charAt(0) + currentVal.slice(1).toLowerCase();
        html += '<option value="' + currentVal + '" selected>' + title + '</option>';
    }
    
    html += '<option value="__NEW__" style="font-weight:bold; color:#5631E8;">+ Ingresar manualmente...</option>';
    
    sel.innerHTML = html;
    sel.dataset.loaded = 'true';
}

async function handleCatSelectChange(sel, eid) {
    var val = sel.value;
    if (val === '__NEW__') {
        var newVal = prompt('Ingresa el nombre de la nueva categoría:');
        if (newVal && newVal.trim() !== '') {
            var upperVal = newVal.trim().toUpperCase();
            sel.dataset.val = upperVal;
            var success = await updateExpense(eid, 'category', upperVal);
            if (success) location.reload();
        } else {
            sel.value = sel.dataset.val || '';
        }
    } else {
        sel.dataset.val = val;
        await updateExpense(eid, 'category', val);
        cleanUnusedCategories();
        applyFilters();
    }
}

/* ── Purga automática de categorías sin uso ── */
function cleanUnusedCategories() {
    var activeCats = new Set();
    document.querySelectorAll('#transactions-list .tx-row').forEach(function(row) {
        var categoryElem = row.querySelector('[data-field="category"]');
        var val = categoryElem ? (categoryElem.dataset.val || categoryElem.value || '').toUpperCase().trim() : '';
        if (val) activeCats.add(val);
    });

    if (window.ALL_CATEGORIES) {
        window.ALL_CATEGORIES = Array.from(activeCats).sort();
    }

    var filterSelect = document.getElementById('filter-category');
    if (filterSelect) {
        var currentFilterVal = (filterSelect.value || '').toUpperCase();
        var html = '<option value="">Categorías</option>';
        Array.from(activeCats).sort().forEach(function(c) {
            var title = c.charAt(0) + c.slice(1).toLowerCase();
            var isSel = (c === currentFilterVal) ? ' selected' : '';
            html += '<option value="' + c + '"' + isSel + '>' + title + '</option>';
        });
        filterSelect.innerHTML = html;
    }

    document.querySelectorAll('.cat-select').forEach(function(sel) {
        sel.dataset.loaded = 'false';
    });
}

/* ── Filtros ── */
function applyFilters() {
    var search   = (document.getElementById('filter-search').value || '').toLowerCase();
    var from     = document.getElementById('filter-date-from').value;
    var to       = document.getElementById('filter-date-to').value;
    var category = (document.getElementById('filter-category').value || '').toUpperCase();
    var type     = document.getElementById('filter-type').value;
    var count = 0, total = 0;

    document.querySelectorAll('#transactions-list .tx-row').forEach(function(row) {
        /* Leer valores desde atributos data-* del <tr> y de los inputs */
        var idText      = (row.cells[0] ? row.cells[0].textContent : '').toLowerCase();
        var dateInp     = row.querySelector('input.date-hidden');
        var dateVal     = dateInp ? dateInp.value : '';
        var merchantInp = row.querySelector('input[data-field="merchant"]');
        var merchantVal = merchantInp ? merchantInp.value.toLowerCase() : '';
        var categoryElem= row.querySelector('[data-field="category"]');
        var categoryVal = categoryElem ? (categoryElem.dataset.val || categoryElem.value || '').toUpperCase() : '';
        var typeInp     = row.querySelector('select[data-field="type"]');
        var typeVal     = typeInp ? typeInp.value : '';
        var detailsTa   = row.querySelector('textarea[data-field="details"]');
        var detailsVal  = detailsTa ? detailsTa.value.toLowerCase() : '';

        /* Monto: leer del atributo data-amount del <tr> para robustez */
        var amountVal   = parseFloat(row.dataset.amount) || 0;

        var match = (
            (!search   || merchantVal.includes(search) || detailsVal.includes(search) || idText.includes(search))
         && (!from     || dateVal >= from)
         && (!to       || dateVal <= to)
         && (!category || categoryVal.includes(category))
         && (!type     || typeVal === type)
        );

        row.style.display = match ? '' : 'none';
        if (match) { count++; total += amountVal; }
    });

    var vc = document.getElementById('visible-count');
    if (vc) vc.textContent = count;
    var ft = document.getElementById('filtered-total');
    if (ft) ft.textContent = '$' + total.toLocaleString('en-US', {minimumFractionDigits: 2});
}

/* ── Inicializar al cargar ── */
function initPage() {
    /* Formatear montos en los inputs */
    document.querySelectorAll('.amount-input').forEach(function(inp) {
        var raw = parseFloat(inp.dataset.raw) || 0;
        if (!inp.value || inp.value.trim() === '') {
            inp.value = formatCurrency(raw);
        }
    });
    /* Formatear fechas */
    document.querySelectorAll('.date-hidden').forEach(function(inp) { updateDateDisplay(inp); });
    /* Calcular total inicial */
    applyFilters();
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initPage);
} else {
    initPage();
}

/* ── API helpers ── */
async function updateExpense(id, field, value) {
    try {
        var payload = { id: id }; payload[field] = value;
        var res = await fetch('/api/update-expense', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
        var data = await res.json();
        if (data.success) {
            var t = document.getElementById('toast');
            if (t) {
                t.querySelector('span').textContent = '✓ Guardado';
                t.classList.add('show');
                setTimeout(function(){ t.classList.remove('show'); }, 2000);
            }
            return true;
        }
    } catch(e) { console.error(e); }
    return false;
}

async function confirmExpense(id, btnElem) {
    if (!confirm('¿Confirmar este gasto?')) return;
    
    /* Actualización Optimista Instantánea */
    var row = btnElem ? btnElem.closest('tr') : document.querySelector('button[onclick*="confirmExpense(' + id + ')"]')?.closest('tr');
    if (row) {
        row.classList.remove(
            'bg-purple-200/80', 'dark:bg-purple-800/50',
            'shadow-lg', 'shadow-purple-500/30',
            'border-purple-300', 'dark:border-purple-600', 'z-10'
        );
        row.classList.add('border-b', 'border-slate-100', 'dark:border-slate-800/40');
        if (btnElem) btnElem.remove();
    }
    
    var success = await updateExpense(id, 'status', 'pending');
    if (!success) {
        alert('No se pudo confirmar el gasto en el servidor.');
        location.reload();
    }
}

async function deleteExpense(id, btnElem) {
    if (!confirm('¿Eliminar? Esta acción es irreversible.')) return;
    
    var row = btnElem ? btnElem.closest('tr') : document.querySelector('button[onclick*="deleteExpense(' + id + ')"]')?.closest('tr');
    if (row) {
        row.style.transition = 'all 0.25s ease';
        row.style.opacity = '0';
        row.style.transform = 'scale(0.95)';
        setTimeout(function() {
            row.remove();
            cleanUnusedCategories();
            applyFilters();
        }, 250);
    }
    
    try {
        var res = await fetch('/api/delete-expense', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:id})});
        var data = await res.json();
        if (data.success) {
            var t = document.getElementById('toast');
            if (t) {
                t.querySelector('span').textContent = '✓ Eliminado';
                t.classList.add('show');
                setTimeout(function(){ t.classList.remove('show'); }, 2000);
            }
        } else {
            alert('Error al eliminar: ' + (data.message || 'Desconocido'));
            location.reload();
        }
    } catch(e) {
        console.error(e);
        location.reload();
    }
}
</script>
</body>
</html>
