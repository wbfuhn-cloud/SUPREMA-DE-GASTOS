name: Calidad y seguridad

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-prod.txt -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p "test_inversiones_phase*.py"
      - run: python -m pip check
      - run: pip install pip-audit==2.9.0 bandit==1.8.6
      - run: pip-audit -r requirements-prod.txt
      - run: bandit -q -r src tools/NOTIFICADOR_BOT -x tests
